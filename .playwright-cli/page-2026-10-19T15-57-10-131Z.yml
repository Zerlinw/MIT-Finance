        - generic [ref=f3e61]: 复利只奖励「在场足够久」的人。巴菲特 99% 的财富是 50 岁之后赚到的。
        - generic: 雪球要滚大，需要两个条件：很湿的雪（可持续的正收益率）和很长的坡（不中断的时间）。中途退出 = 雪球停下 = 奇迹不会发生。这就是为什么「开始得早」比「择时准」重要得多。
