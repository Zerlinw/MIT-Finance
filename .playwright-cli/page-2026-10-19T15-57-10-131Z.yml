        - generic [ref=f3e66]: 单次结果靠运气，长期结果由期望值决定。大数定律是普通人最强大的盟友。
        - generic: 赌场不怕你赢一次，只怕你不来——因为每一局它都有微弱正期望，重复足够多次，利润必然兑现。把赌场的逻辑反过来用在自己身上：只参与正期望的游戏，然后让重复次数说话。
      - generic [ref=f3e67] [cursor=pointer]:
