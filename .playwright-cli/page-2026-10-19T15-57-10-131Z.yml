        - generic [ref=f3e71]: 先求不亏，再求赚钱。风险管理的目标不是消除波动，而是避免毁灭。
        - generic: 亏损 50% 需要赚 100% 才能回本——不对称的伤害是所有复利的头号杀手。所以科学的投资顺序永远是：先确定最坏情况能否承受，再讨论能赚多少。
