name: ✨ 功能建议
description: 建议新的页面、筛选、交互、无障碍或工程改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先说明要解决的问题，再描述期望的方案。
        如果建议涉及新的第三方依赖或构建工具，请说明为什么原生能力不够。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前有什么不便？谁会遇到？在什么场景下？
      placeholder: 在课程列表页无法按“是否有图解”筛选，导致……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望如何解决？可以是交互、页面、数据字段或工程流程
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些其它做法？为什么不采用？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 这个建议主要涉及哪一部分？
      options:
        - 页面 / 导航
        - 筛选 / 搜索 / 排序
        - 图解渲染 / 阅读体验
        - 数据模型 / 内容结构
        - 无障碍 / 性能
        - 构建 / CI / 发布
        - 文档 / 协作流程
        - 其它
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 参考实现、草图、相关 Issue 或截图
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue / Discussions，确认不是重复建议
          required: true
        - label: 该建议不涉及视频内容或未授权素材
          required: true
        - label: 我理解项目优先保持零运行时依赖
          required: true
