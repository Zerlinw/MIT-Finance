name: 🐛 Bug 报告
description: 报告页面错误、样式异常、交互故障或资源加载失败
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现的信息。
        如果是**安全漏洞**，请不要在这里提交，改用 [私密漏洞报告](https://github.com/Zerlinw/OpenCourseAtlas/security/advisories/new)。

  - type: input
    id: page
    attributes:
      label: 页面 URL
      description: 出现问题的页面完整地址（本地开发可写路径与参数）
      placeholder: https://zerlinw.github.io/OpenCourseAtlas/course.html?id=mit-6-0001
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？影响哪些用户或内容？
      placeholder: 打开课程页后，章节区域没有渲染……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从哪个页面开始、点击了什么、输入了什么
      placeholder: |
        1. 打开首页
        2. 点击「课程」
        3. 选择「计算机科学」
        4. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望看到什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际看到什么？可附截图或错误信息
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 浏览器 / 系统
      description: 例如 Chrome 130 / Windows 11、Safari 18 / iOS 18
      placeholder: Chrome 130 / Windows 11
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: 控制台 / 网络错误
      description: 打开 DevTools → Console / Network，粘贴相关报错
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复问题
          required: true
        - label: 我已阅读贡献指南
          required: true
        - label: 这不是安全漏洞（安全漏洞请走私密报告）
          required: true
