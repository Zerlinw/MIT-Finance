name: 📚 内容更新
description: 新增或修正学校、课程、章节、知识点图解
title: "[Content]: "
labels:
  - content
body:
  - type: markdown
    attributes:
      value: |
        本模板用于**内容新增或修正**。请提供可核对的公开来源。
        本项目**只收录图解与结构化整理，不收录视频**；请勿提交整段教材、讲义扫描件或未授权图片。

  - type: dropdown
    id: kind
    attributes:
      label: 更新类型
      options:
        - 新增学校
        - 新增课程
        - 新增章节 / 图解
        - 修正事实 / 文案
        - 修正图解数据
        - 修正链接 / 元数据
        - 其它
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: 目标页面 / 实体
      description: 课程 id、学校 id、页面 URL 或数据文件位置
      placeholder: mit-6-0001 / https://.../course.html?id=mit-6-0001
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 变更内容
      description: 要新增或修正什么？为什么？
      placeholder: 新增剑桥大学数学 Tripos 课程，包含 3 个章节与 6 张图解……
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: 来源链接
      description: 课程主页、公开讲义、排名来源等；至少 1 条
      placeholder: |
        - https://...
        - https://...
    validations:
      required: true

  - type: textarea
    id: alignment
    attributes:
      label: 与现有结构的关系
      description: 归属的学校 / 学科 / 难度、建议的课程 id、章节划分、图解类型
    validations:
      required: false

  - type: checkboxes
    id: copyright
    attributes:
      label: 版权与内容确认
      options:
        - label: 内容来自公开课程 / 公开讲义，并已注明来源
          required: true
        - label: 未包含视频、整段教材复制或未授权图片
          required: true
        - label: 关键事实（排名、年份、人名、公式）已核对
          required: true
        - label: 我理解维护者可能要求调整结构、改写文案或补充来源
          required: true
